<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#818cf8;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGlow)" />

  <!-- Dynamic Tech Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="6 6" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="6 6" />
  </g>

  <!-- Dynamic Background Particles / Orbs -->
  <circle cx="140" cy="80" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cy" values="80;120;80" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.14;0.08" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="1060" cy="270" r="160" fill="#818cf8" opacity="0.09" filter="url(#glow)">
    <animate attributeName="cy" values="270;220;270" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.09;0.15;0.09" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="850" cy="70" r="90" fill="#ec4899" opacity="0.06" filter="url(#glow)">
    <animate attributeName="cx" values="850;890;850" dur="13s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Circuit Line at Top -->
  <path d="M 50,25 L 350,25 L 380,45 L 820,45 L 850,25 L 1150,25" fill="none" stroke="url(#accentLine)" stroke-width="1.8" opacity="0.7">
    <animate attributeName="stroke-dasharray" values="0,1500; 1500,0; 0,1500" dur="10s" repeatCount="indefinite" />
  </path>

  <!-- FOREGROUND CONTENT: Clean, Protected, Always Sharp & Visible -->
  
  <!-- Terminal Prompt Tag -->
  <g transform="translate(600, 72)">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="-116" cy="-1" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="5" fill="#94a3b8" font-size="13" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      DEVELOPER TOOLBOX • 2026
    </text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(600, 145)">
    <text x="0" y="0" text-anchor="middle" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#subtleGlow)">
      Awesome Developer Utilities
    </text>
  </g>

  <!-- Gradient Divider -->
  <line x1="380" y1="172" x2="820" y2="172" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Subtitle -->
  <g transform="translate(600, 208)">
    <text x="0" y="0" text-anchor="middle" font-size="18" fill="#e2e8f0" font-weight="500">
      ⚡ Modern Terminals • 🚀 App Launchers • 🌐 API Clients • 🐳 Container Engines
    </text>
  </g>

  <g transform="translate(600, 238)">
    <text x="0" y="0" text-anchor="middle" font-size="14" fill="#94a3b8" font-weight="400">
      Curated rankings, star metrics, pricing tiers, and open-source alternatives for daily engineering speed.
    </text>
  </g>

  <!-- Interactive/Dynamic Feature Badges (Pills) -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: GPU Terminals -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#131c2e" stroke="#2563eb" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
      </rect>
      <text x="82" y="23" fill="#60a5fa" font-size="12.5" font-weight="600" text-anchor="middle">💻 GPU Terminals</text>
    </g>

    <!-- Pill 2: Fast Launchers -->
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#131c2e" stroke="#8b5cf6" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
      </rect>
      <text x="82" y="23" fill="#c084fc" font-size="12.5" font-weight="600" text-anchor="middle">⚡ Smart Launchers</text>
    </g>

    <!-- Pill 3: API Testing -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#131c2e" stroke="#06b6d4" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="82" y="23" fill="#38bdf8" font-size="12.5" font-weight="600" text-anchor="middle">📡 API Clients</text>
    </g>

    <!-- Pill 4: Container GUIs -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="165" height="36" rx="8" fill="#131c2e" stroke="#ec4899" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite" />
      </rect>
      <text x="82" y="23" fill="#f472b6" font-size="12.5" font-weight="600" text-anchor="middle">🐳 Containers &amp; CLI</text>
    </g>
  </g>
</svg>
